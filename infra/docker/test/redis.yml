services:
  cache:
    image: redis:${REDIS_VERSION}
    container_name: cache
    ports:
      - 6379:6379
    volumes:
      - .infra/docker/config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ${REDIS_VOLUME}/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - ${NETWORK_APPLICATION}